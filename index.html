<style>
:root{--tl:#19E3C8;--pk:#FF2D6F;--lv:#C9D0F5;--ink:#E8EEFF;--card:rgba(31,49,87,.86);--m:"Space Mono","Courier New",monospace;--s:"Inter","Segoe UI",system-ui,sans-serif;--u:min(.9vw,3.4px);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(90px + env(safe-area-inset-top,0px));background:#071A26}
body{margin:0;color:var(--ink);font:16px/1.7 var(--m);background:linear-gradient(180deg,#071A26 0%,#0A2A38 22%,#12263F 50%,#1B1535 75%,#2A0F2E 100%);overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#071A26;z-index:60}
a{color:inherit}:focus-visible{outline:2px solid var(--tl);outline-offset:3px;border-radius:6px}
.bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main{position:relative;z-index:1;padding-bottom:120px;overflow:hidden}
.w{max-width:960px;margin:0 auto;padding:0 22px}
.bar{position:fixed;left:0;top:0;height:3px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--tl),var(--pk));z-index:70;box-shadow:0 0 12px var(--tl)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:linear-gradient(180deg,rgba(10,42,56,.92),rgba(10,42,56,.7));backdrop-filter:blur(12px);border-bottom:1px solid rgba(25,227,200,.25)}
header .w{display:flex;align-items:center;justify-content:space-between;height:72px;max-width:1100px}
.lg{font:800 40px/1 var(--s);color:var(--ink);text-decoration:none;letter-spacing:-.04em;text-shadow:-3px 0 var(--tl),3px 0 var(--pk)}
.lg:hover{animation:gl .35s steps(2) 2}
@keyframes gl{50%{text-shadow:5px 2px var(--tl),-5px -2px var(--pk);transform:translateX(2px)}}
.cta{font:700 15px var(--s);padding:12px 18px;border:1.5px solid var(--tl);border-radius:10px;background:rgba(10,24,44,.7);color:var(--ink);text-decoration:none;box-shadow:0 0 18px rgba(25,227,200,.2);transition:.25s}
.cta:hover{background:var(--tl);color:#04121a;box-shadow:0 0 28px rgba(25,227,200,.6)}
.tg{font:italic 400 17px var(--m);color:var(--tl)}
.hero{text-align:center;padding:48px 22px 10px}
.hero .hi{color:var(--lv);margin:6px 0 0}
.hero h1{font:800 clamp(46px,12vw,96px)/1 var(--s);letter-spacing:-.04em;margin:4px 0 8px;background:linear-gradient(90deg,var(--tl),#7AA2FF 55%,var(--pk));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(25,227,200,.3))}
.role{font:700 clamp(17px,3.4vw,22px) var(--m);color:var(--lv);min-height:1.8em;margin:0 0 26px}
.role b{color:var(--pk)}.role i{display:inline-block;width:.6ch;height:1.1em;background:var(--tl);vertical-align:-.15em;margin-left:2px;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.orb{position:relative;width:calc(var(--u)*100);height:calc(var(--u)*100);margin:0 auto}
.ring{position:absolute;left:50%;top:50%;border-radius:50%;border:1px dashed rgba(25,227,200,.25);animation:spin var(--T) linear infinite}
.ring.rev{animation-direction:reverse}
.slot,.un{position:absolute;left:50%;top:50%;width:0;height:0}
.bd{position:absolute;left:calc(var(--u)*-5.5);top:calc(var(--u)*-5.5);width:calc(var(--u)*11);height:calc(var(--u)*11);border-radius:50%;display:grid;place-items:center;background:#0E1A30;border:1px solid rgba(25,227,200,.4);font:700 calc(var(--u)*2.7) var(--s);box-shadow:0 0 18px rgba(25,227,200,.25);animation:spin var(--T) linear infinite reverse}
.ring.rev .bd{animation-direction:normal}
@keyframes spin{to{transform:rotate(360deg)}}
.core{position:absolute;left:50%;top:50%;width:calc(var(--u)*25);height:calc(var(--u)*25);margin:calc(var(--u)*-12.5) 0 0 calc(var(--u)*-12.5);border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#2B3A66,#0A1224 70%);box-shadow:-10px -6px 36px rgba(25,227,200,.5),10px 6px 36px rgba(255,45,111,.5);font:italic 700 calc(var(--u)*6) var(--s);text-shadow:-2px 0 var(--tl),2px 0 var(--pk);animation:pu 4s ease-in-out infinite}
@keyframes pu{50%{transform:scale(1.07)}}
.bio{max-width:600px;margin:50px auto 0;padding:0 22px 0 40px;position:relative}
.bio p{margin:14px 0}
.bio b,.hl{font:700 1.18em/1.3 var(--s);letter-spacing:-.01em;color:inherit}
.rb{position:relative;height:150px;margin:40px 0}
.rb div{position:absolute;left:-5%;width:110%;overflow:hidden;white-space:nowrap}
.rb .x{top:46px;transform:rotate(2.2deg);background:#0A1A2B;border-block:1px solid rgba(255,45,111,.4);color:transparent;-webkit-text-stroke:1px rgba(255,45,111,.7);padding:12px 0}
.rb .y{top:30px;transform:rotate(-3deg);background:linear-gradient(90deg,var(--tl),#12B8A4);color:#04121A;padding:10px 0;box-shadow:0 0 40px rgba(25,227,200,.4)}
.rb span{display:inline-block;font:800 24px var(--s);animation:mq 32s linear infinite}
.rb .x span{animation-direction:reverse}
@keyframes mq{to{transform:translateX(-50%)}}
.ttl{position:relative;text-align:center;padding:70px 0 34px}
.ghost{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:800 clamp(64px,19vw,190px)/1 var(--s);color:transparent;-webkit-text-stroke:1px rgba(25,227,200,.18);white-space:nowrap;letter-spacing:-.04em;text-transform:uppercase}
.ttl h2{position:relative;margin:0;font:800 clamp(44px,10vw,76px)/1.05 var(--s);letter-spacing:-.04em;color:var(--lv);text-shadow:0 0 30px rgba(120,140,255,.45)}
.ttl .tg{position:relative;text-align:left;max-width:520px;margin:0 auto}
.tlw{position:relative;padding-left:46px;margin-bottom:34px}
.tlw::before{content:"";position:absolute;left:13px;top:46px;bottom:34px;width:3px;border-radius:3px;background:linear-gradient(var(--tl),var(--pk));box-shadow:0 0 12px var(--tl)}
.n1,.n2{position:absolute;left:3px;width:23px;height:23px;border-radius:50%;box-shadow:0 0 16px var(--tl)}
.n1{top:24px;border:3px solid var(--tl);background:#0A1A2B}.n2{bottom:20px;background:var(--tl);border:3px solid #0A1A2B;box-shadow:0 0 18px var(--tl)}
.cd{background:var(--card);border:1.5px solid rgba(25,227,200,.4);border-radius:14px;padding:22px;box-shadow:0 0 34px rgba(25,227,200,.14),0 14px 40px rgba(0,0,0,.35);transition:transform .35s,box-shadow .35s}
.cd:hover{transform:translateY(-4px);box-shadow:0 0 44px rgba(25,227,200,.32),0 18px 44px rgba(0,0,0,.4)}
.hd{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.lo{width:54px;height:54px;flex:none;border-radius:14px;background:#000;display:grid;place-items:center;font:800 26px var(--s);color:var(--tl);box-shadow:0 0 0 1px rgba(255,255,255,.08),0 6px 18px rgba(0,0,0,.5);transform:rotate(-6deg)}
.hd h3{margin:0;font:700 26px/1.1 var(--s);letter-spacing:-.02em}.hd h3 a{text-decoration:none}.hd h3 a span{color:var(--tl);font-size:17px}
.hd div div{font:700 14px var(--m);margin-top:4px}
.cd ul{margin:0 0 16px;padding-left:20px}.cd li{margin-bottom:10px;font-size:15px}.cd li::marker{color:var(--tl)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.cd ul.chips{padding:0}.cd .chips li{margin:0;font:700 14px var(--m);padding:5px 12px;border-radius:8px;background:rgba(25,227,200,.1);border:1px solid rgba(25,227,200,.28);color:#BFEEE6}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.pg .cd:first-child{grid-column:1/-1}
.nm{display:flex;gap:26px;flex-wrap:wrap;margin:6px 0 16px}.nm b{display:block;font:800 clamp(28px,5vw,40px)/1 var(--s);background:linear-gradient(90deg,var(--tl),var(--pk));-webkit-background-clip:text;background-clip:text;color:transparent}.nm span{font-size:13px;color:var(--lv)}
.ach{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.ach .cd{display:flex;gap:14px;align-items:flex-start}.ach .ic{font-size:28px;line-height:1}.ach p{margin:0;font-size:15px}.ach small{color:var(--lv);display:block;margin-top:4px}
.ct{text-align:center;padding:30px 0 20px}
.ct h2{font:800 clamp(34px,8vw,64px)/1.05 var(--s);letter-spacing:-.04em;margin:8px 0 16px;color:var(--lv);text-shadow:0 0 30px rgba(120,140,255,.4)}
.mail{display:inline-block;font:700 clamp(17px,4.6vw,26px) var(--m);color:var(--tl);text-decoration:none;border-bottom:2px solid var(--pk);word-break:break-all}
.soc{display:flex;gap:10px;justify-content:center;margin:26px 0 8px;flex-wrap:wrap}.soc a{padding:9px 18px;border:1px solid rgba(25,227,200,.35);border-radius:10px;text-decoration:none;background:rgba(10,24,44,.6)}.soc a:hover{border-color:var(--pk);color:var(--pk)}
.ft{text-align:center;color:var(--lv);font-size:14px;margin-top:40px;opacity:.8}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:55;display:flex;gap:4px;padding:6px;background:rgba(14,22,38,.88);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.12);border-radius:20px;box-shadow:0 10px 34px rgba(0,0,0,.5)}
.dock a{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:14px;text-decoration:none;font:500 15px var(--s);border:1px solid transparent;color:var(--lv);white-space:nowrap}
.dock a.on{border-color:rgba(25,227,200,.55);background:rgba(25,227,200,.12);color:#fff}
.rk{position:fixed;right:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:55;width:54px;height:54px;border-radius:50%;border:0;background:#0E1A30;cursor:pointer;display:grid;place-items:center;font-size:22px;box-shadow:0 0 22px rgba(25,227,200,.4);opacity:0;pointer-events:none;transform:translateY(14px);transition:.35s}
.rk.on{opacity:1;pointer-events:auto;transform:none}.rk svg{position:absolute;inset:0;transform:rotate(-90deg)}
.rv{opacity:0;transform:translateY(30px);transition:opacity .8s,transform .8s cubic-bezier(.2,.8,.2,1)}.rv.in{opacity:1;transform:none}
@media(max-width:700px){.pg,.ach{grid-template-columns:1fr}.bio{padding-left:34px}.dock a{padding:10px 11px;font-size:14px}.dock a span{display:none}.dock a.on span{display:inline}.cta{font-size:13px;padding:10px 12px}header .w{height:68px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
.lo.w{background:#fff;padding:8px;transform:none}.lo img{width:100%;height:100%;object-fit:contain;display:block}
.gl3{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.orb canvas{position:absolute;inset:0;width:100%;height:100%}
.core3{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:italic 700 calc(var(--u)*5) var(--s);text-shadow:-2px 0 var(--tl),2px 0 var(--pk);pointer-events:none}
.cd{position:relative;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(0);transform-style:preserve-3d;transition:transform .18s ease-out,box-shadow .35s}
.cd:hover{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-4px)}
.cd::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(circle at var(--gx,50%) var(--gy,0%),rgba(255,255,255,.13),transparent 55%);opacity:var(--go,0);transition:opacity .3s}
.cd .lo{transform:translateZ(34px) rotate(-6deg)}.lo.w{transform:translateZ(34px)}
.cd h3,.cd .nm{transform:translateZ(22px)}
.sub3{text-align:center;color:var(--lv);margin:0 0 10px}.globe{position:relative;width:min(94vw,540px);aspect-ratio:1;margin:0 auto;touch-action:pan-y;cursor:grab}.globe:active{cursor:grabbing}.globe canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hlk{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:30px auto 0;max-width:640px}.hlk a{padding:10px 18px;border:1px solid rgba(25,227,200,.35);border-radius:10px;text-decoration:none;background:rgba(10,24,44,.6);font:600 15px var(--s);transition:.25s}.hlk a:hover{border-color:var(--pk);color:var(--pk)}.hlk a.cta{background:var(--tl);color:#04121A;border-color:var(--tl);box-shadow:0 0 22px rgba(25,227,200,.4)}.hlk a.cta:hover{color:#04121A;background:#6CF3E0}
.sh{color:var(--lv);font-size:14px;margin:22px 0 0;animation:bl2 2.2s ease-in-out infinite}@keyframes bl2{50%{opacity:.4;transform:translateY(5px)}}
</style>
